<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Persia social card</title>
  <!-- Source for og.png (1200 x 630). Render: serve the repo root, open og.html at a 1200 x 630
       viewport, screenshot. docs/og/hero.jpg is a real frame of wave 5, scaled from 1920 x 1080 to
       1440 x 810: open the game at ?debug&auto, press Play, and take it about 0.4 s after the cat's
       word appears, so the word, its Latin spelling and the cat's face are all in the frame. The card
       crops the HUD off the top. The logo copies the title screen's .logo (src/ui/css/screens.css).
       Render headed, not headless: only a headed browser takes system-ui from the desktop, and that
       is the font of the tagline and bar. -->
  <style>
    :root { --void: #05060b; --gold: #ffd24a;
      --display: "Bahnschrift", "DejaVu Sans Condensed", "Liberation Sans Narrow", "Arial Narrow", sans-serif; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--void); }
    body { position: relative; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #f2f5ff; -webkit-font-smoothing: antialiased; }
    .shot { position: absolute; left: 0; top: -60px; width: 1200px; height: 675px; }
    .scrim { position: absolute; inset: 0; background:
      radial-gradient(ellipse 50% 30% at 50% 63%, rgba(5, 6, 11, 0.7), rgba(5, 6, 11, 0) 100%); }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: var(--void);
      display: flex; align-items: center; justify-content: center; }
    .play { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: 0.01em; color: rgba(242, 245, 255, 0.86); }
    .play b { color: var(--gold); font-weight: 800; }
    .brand { position: absolute; left: 0; right: 0; top: 292px; text-align: center; }
    .logo { position: relative; display: inline-block; margin: 0; padding-left: 0.12em;
      font: 900 124px/1 var(--display); font-stretch: condensed; letter-spacing: 0.12em; }
    .logo span { display: block; }
    .logo-text { position: relative; color: transparent;
      background: linear-gradient(180deg, #ffffff 0%, #c9fbff 30%, #46f2ff 52%, #8a5cff 74%, #ff4fd8 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-stroke: 1.5px rgba(10, 0, 40, 0.5); }
    .logo-glow { position: absolute; inset: 0; color: #3fd8ff; filter: blur(24px); opacity: 0.75; }
    .logo-chroma { position: absolute; inset: 0; opacity: 0.55; mix-blend-mode: screen; }
    .logo-chroma.c1 { color: #ff2fd0; transform: translateX(-3px); }
    .logo-chroma.c2 { color: #2ff6ff; transform: translateX(3px); }
    .logo-shine { position: absolute; inset: 0; color: transparent;
      background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.6) 38%, transparent 46%);
      -webkit-background-clip: text; background-clip: text; }
    .logo::after { content: ""; position: absolute; inset: 0; mix-blend-mode: multiply;
      background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0) 0 4px, rgba(0, 0, 20, 0.35) 4px 6px); }
    .tagline { margin: 14px 0 0; font-size: 28px; line-height: 1.25; font-weight: 800;
      color: rgba(226, 248, 255, 0.95); text-shadow: 0 2px 12px #000, 0 0 2px #000; }
  </style>
</head>
<body>
  <img class="shot" src="docs/og/hero.jpg" alt="">
  <div class="scrim"></div>
  <div class="brand">
    <h1 class="logo">
      <span class="logo-glow">PERSIA</span><span class="logo-chroma c1">PERSIA</span><span class="logo-chroma c2">PERSIA</span><span class="logo-text">PERSIA</span><span class="logo-shine">PERSIA</span>
    </h1>
    <p class="tagline">Four levels of angry animals and their giants, all named in Persian.</p>
  </div>
  <div class="bar"><p class="play">Free in your browser at <b>persia.cocode.dk</b></p></div>
</body>
</html>
