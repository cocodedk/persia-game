<!doctype html>
<html lang="en">
<head>
  <!-- SEO keywords:
       primary:   arcade shooter
       secondary: browser game, boss fight, Persian, free online game
       intent:    navigational / play
       Nothing in this head makes a network request: the game runs offline at any sub-path. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persia: an arcade shooter</title>
  <meta name="description" content="Free arcade shooter in your browser. Seven levels of angry animals, each named in Persian as it arrives, and a giant at the end of each.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#05060b">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Persia">
  <meta property="og:title" content="Persia: an arcade shooter">
  <meta property="og:description" content="Shoot down waves of angry animals and seven giants: a cat, a mouse, a fish, a bird, a cow, a dog and a horse. You hear each animal's name in Persian when it shows up. Free in your browser.">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The PERSIA logo under a formation of angry pixel cats and dogs, a blood-red moon over the ruins of Persepolis, and a Persian word with each letter in its own colour">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Persia: an arcade shooter">
  <meta name="twitter:description" content="Shoot down waves of angry animals and seven giants: a cat, a mouse, a fish, a bird, a cow, a dog and a horse. You hear each animal's name in Persian when it shows up. Free in your browser.">
  <meta name="twitter:image:alt" content="The PERSIA logo under a formation of angry pixel cats and dogs, a blood-red moon over the ruins of Persepolis, and a Persian word with each letter in its own colour">
  <link rel="canonical" href="https://persia.cocode.dk/">
  <meta property="og:url" content="https://persia.cocode.dk/">
  <meta property="og:image" content="https://persia.cocode.dk/og.png">
  <meta name="twitter:image" content="https://persia.cocode.dk/og.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Persia",
    "description": "Free arcade shooter in your browser. Seven levels of angry animals, each named in Persian as it arrives, and a giant at the end of each.",
    "url": "https://persia.cocode.dk/",
    "image": "https://persia.cocode.dk/og.png",
    "genre": ["Shooter", "Arcade"],
    "gamePlatform": "Web browser",
    "applicationCategory": "Game",
    "operatingSystem": "Any",
    "playMode": "SinglePlayer",
    "numberOfPlayers": { "@type": "QuantitativeValue", "value": 1 },
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Person", "name": "Babak Bandpey", "url": "https://linkedin.com/in/babakbandpey" },
    "publisher": { "@type": "Organization", "name": "Cocode", "url": "https://cocode.dk" },
    "codeRepository": "https://github.com/cocodedk/persia-game"
  }
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="src/ui/css/base.css">
  <link rel="stylesheet" href="src/ui/css/screens.css">
  <link rel="stylesheet" href="src/ui/css/word.css">
  <link rel="stylesheet" href="src/ui/css/open.css">
</head>
<body>
  <canvas id="game" width="1920" height="1080"></canvas>
  <div id="words"></div>
  <div id="ui"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
