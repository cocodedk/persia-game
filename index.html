<!doctype html>
<html lang="en">
<head>
  <!-- SEO keywords:
       primary:   arcade shooter
       secondary: browser game, boss fights, free online game
       intent:    navigational / play
       Nothing in this head makes a network request: the game runs offline at any sub-path. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persia</title>
  <meta name="description" content="Free arcade shooter in your browser: 8 worlds, 40 levels, bosses and power-ups.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#05060b">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Invaders">
  <meta property="og:title" content="Invaders — the arcade shooter">
  <meta property="og:description" content="Fly free, break alien formations and beat a boss in each of 8 worlds. Free in your browser.">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The INVADERS logo over a neon city at night, a pyramid-shaped boss firing down at the player's ship, and frames from four other worlds">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Invaders — the arcade shooter">
  <meta name="twitter:description" content="Fly free, break alien formations and beat a boss in each of 8 worlds. Free in your browser.">
  <meta name="twitter:image:alt" content="The INVADERS logo over a neon city at night, a pyramid-shaped boss firing down at the player's ship, and frames from four other worlds">
  <link rel="canonical" href="https://invaders.cocode.dk/">
  <meta property="og:url" content="https://invaders.cocode.dk/">
  <meta property="og:image" content="https://invaders.cocode.dk/og.png">
  <meta name="twitter:image" content="https://invaders.cocode.dk/og.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Invaders",
    "description": "Free arcade shooter in your browser: 8 worlds, 40 levels, bosses and power-ups.",
    "url": "https://invaders.cocode.dk/",
    "image": "https://invaders.cocode.dk/og.png",
    "genre": ["Shooter", "Arcade"],
    "gamePlatform": "Web browser",
    "applicationCategory": "Game",
    "operatingSystem": "Any",
    "playMode": "SinglePlayer",
    "numberOfPlayers": { "@type": "QuantitativeValue", "value": 1 },
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Person", "name": "Babak Bandpey", "url": "https://linkedin.com/in/babakbandpey" },
    "publisher": { "@type": "Organization", "name": "Cocode", "url": "https://cocode.dk" },
    "codeRepository": "https://github.com/cocodedk/invaders"
  }
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="src/ui/css/base.css">
  <link rel="stylesheet" href="src/ui/css/screens.css">
  <link rel="stylesheet" href="src/ui/css/word.css">
</head>
<body>
  <canvas id="game" width="1920" height="1080"></canvas>
  <div id="words"></div>
  <div id="ui"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
